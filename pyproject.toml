[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-robot-agent"
version = "1.2.1"
description = "Single ReAct robot agent with working and SQLite episodic memory"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6.0.1"]

[project.scripts]
robot-agent = "robot_agent.cli:main"

[tool.setuptools.packages.find]
include = ["robot_agent*"]

[tool.setuptools.package-data]
robot_agent = ["prompts/*.md"]
