name: Mock demo
on: [push, pull_request]
jobs:
  demo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m robot_agent demo --memory --output-dir runtime/ci-demo
      - run: python -m robot_agent demo --memory --fault POSE_STALE --output-dir runtime/ci-recovery
