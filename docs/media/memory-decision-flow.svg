<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">How both memories enter a real Qwen decision</title><desc id="desc">Working Memory and a verified SQLite episode from a previous mission are supplied to Qwen. It chooses locate_object, then completes grasp and return; independent mock feedback verifies A and holding.</desc><rect x="1" y="1" width="1198" height="378" rx="18" fill="#172B2A" stroke="#2D4240"/><text x="28" y="45" font-family="Georgia,Times New Roman,serif" font-size="31" font-weight="700" fill="#F1F5EE" >Both memories, one next decision.</text><text x="28" y="75" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#AFC3BA" >Actual cross-mission retrieval and a new Qwen decision · Mock/API-level evaluation</text><rect x="28" y="103" width="280" height="99" rx="12" fill="#263C37" stroke="#3C554B"/><text x="45" y="130" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#A3D1BD" letter-spacing="1.4">WORKING MEMORY</text><text x="45" y="162" font-family="Consolas,Liberation Mono,monospace" font-size="22" font-weight="700" fill="#F3F6F0" >B / POSE_STALE</text><text x="45" y="186" font-family="Consolas,Liberation Mono,monospace" font-size="16" font-weight="400" fill="#B3C8BD" >current pose = null</text><rect x="28" y="220" width="280" height="99" rx="12" fill="#3C352A" stroke="#62503A"/><text x="45" y="247" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#E6C695" letter-spacing="1.3">EPISODIC MEMORY / SQLITE</text><text x="45" y="278" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#FAF1E0" >verified recovery</text><text x="45" y="303" font-family="Consolas,Liberation Mono,monospace" font-size="17" font-weight="400" fill="#DAC7A7" >locate → grasp</text><rect x="398" y="132" width="230" height="153" rx="12" fill="#EFF4ED" stroke="none"/><text x="417" y="163" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#3B6454" letter-spacing="1.4">QWEN / REACT</text><text x="417" y="201" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#172631" >Current state</text><text x="417" y="229" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#172631" >+ verified history</text><text x="417" y="260" font-family="Consolas,Liberation Mono,monospace" font-size="16" font-weight="400" fill="#5D7567" >choose ONE tool</text><rect x="710" y="132" width="240" height="153" rx="12" fill="#263C37" stroke="#4C695B"/><text x="729" y="163" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#A3D1BD" letter-spacing="1.2">EXECUTE &amp; VERIFY</text><text x="729" y="201" font-family="Consolas,Liberation Mono,monospace" font-size="21" font-weight="700" fill="#F3F6F0" >locate_object</text><text x="729" y="229" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#C3D6C9" >then grasp / return</text><text x="729" y="260" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#B3C8BD" >fresh observations</text><rect x="1022" y="132" width="151" height="153" rx="12" fill="#254B3E" stroke="#4B8066"/><text x="1040" y="163" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#C8E2CF" letter-spacing="1.2">FINAL GOAL</text><text x="1040" y="203" font-family="Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#F0F8E9" >A = true</text><text x="1040" y="233" font-family="Consolas,Liberation Mono,monospace" font-size="16" font-weight="700" fill="#F0F8E9" >HELD = true</text><text x="1040" y="260" font-family="Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#CCE6B4" >COMPLETED</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8EAE9C" stroke-width="1.5"/></marker></defs><g fill="none" stroke="#8EAE9C" stroke-width="2" marker-end="url(#arrow)"><path d="M309 153H352V174H388"/><path d="M309 270H352V243H388"/><path d="M629 208H699"/><path d="M951 208H1011"/></g><text x="28" y="352" font-family="Consolas,Liberation Mono,monospace" font-size="16" font-weight="400" fill="#B5CBBC" >7 Qwen decisions  ·  1 stale-pose failure  ·  1 verified recovery  ·  history actually injected</text></svg>
